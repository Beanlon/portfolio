<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jeric Mata">
  <defs>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24" />
      <stop offset="100%" stop-color="#0f0f14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#surface)" />
  <rect
    width="32"
    height="32"
    rx="8"
    fill="none"
    stroke="url(#accent)"
    stroke-width="0.75"
    opacity="0.4"
  />

  <path
    d="M3 27 L27 3"
    stroke="url(#accent)"
    stroke-width="1.25"
    stroke-linecap="round"
    opacity="0.35"
  />

  <text
    x="15.5"
    y="21"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-weight="800"
    font-size="11.5"
    letter-spacing="-0.35"
    fill="url(#accent)"
    filter="url(#glow)"
  >
    JM
  </text>

  <circle cx="7" cy="25" r="1.25" fill="#f97316" opacity="0.55" />
</svg>
